name: Keep Render service warm

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check Vera health
        run: |
          curl --fail --silent --show-error \
            --max-time 100 \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 5 \
            https://magicpinveraai-v8gw.onrender.com/v1/healthz